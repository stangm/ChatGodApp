<!DOCTYPE html>
<!--
  Autoplay spike for OBS browser sources.

  Answers one question: can a browser source play SOUND on page load with no user
  gesture? Tests the two mechanisms independently, because they are gated separately:

    1. <audio> element  -> play() returns a promise that rejects with NotAllowedError
                           if blocked by autoplay policy.
    2. AudioContext     -> starts in state "suspended" if blocked, "running" if not.

  The design in DESIGN_BROWSER_OVERLAY.md needs BOTH: the <audio> element to play the
  TTS, and the AudioContext to analyse it for lip sync.

  HOW TO USE
    1. In OBS: + -> Browser -> tick "Local file" -> browse to this file.
    2. Set width 800, height 600. Tick "Control audio via OBS".
    3. Read the result on screen. You should also HEAR two short beeps.
    4. Compare against opening this same file directly in Chrome, where it should be
       blocked -- that confirms the test itself works.

  No server needed. The test tone is generated in JS, so there are no external files.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    background: #111; color: #eee; margin: 0; padding: 24px;
    font-family: Consolas, monospace; font-size: 20px;
  }
  h1 { font-size: 26px; margin: 0 0 16px; }
  .row { margin: 14px 0; padding: 12px 16px; border-left: 6px solid #555; background: #1c1c1c; }
  .pass { border-color: #3ac36a; }
  .fail { border-color: #e0523f; }
  .wait { border-color: #d8a33c; }
  .label { color: #9aa; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }
  .value { font-size: 24px; margin-top: 4px; }
  .detail { color: #889; font-size: 15px; margin-top: 4px; word-break: break-all; }
  #verdict { margin-top: 24px; font-size: 30px; font-weight: bold; }
</style>
</head>
<body>

<h1>OBS browser source &mdash; audio autoplay spike</h1>

<div class="row wait" id="row-audio">
  <div class="label">1. &lt;audio&gt; element autoplay</div>
  <div class="value" id="v-audio">testing...</div>
  <div class="detail" id="d-audio"></div>
</div>

<div class="row wait" id="row-ctx">
  <div class="label">2. AudioContext (needed for lip sync)</div>
  <div class="value" id="v-ctx">testing...</div>
  <div class="detail" id="d-ctx"></div>
</div>

<div class="row" id="row-env">
  <div class="label">Environment</div>
  <div class="detail" id="d-env"></div>
</div>

<div id="verdict">Running...</div>

<script>
// ---- Generate a short test tone as a real WAV blob (no external files) ----
function makeWavBlob(freq, seconds, sampleRate) {
  const n = Math.floor(sampleRate * seconds);
  const buf = new ArrayBuffer(44 + n * 2);
  const dv = new DataView(buf);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(off + i, s.charCodeAt(i)); };

  str(0, 'RIFF');  dv.setUint32(4, 36 + n * 2, true);  str(8, 'WAVE');
  str(12, 'fmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true);            // PCM
  dv.setUint16(22, 1, true);            // mono
  dv.setUint32(24, sampleRate, true);
  dv.setUint32(28, sampleRate * 2, true);
  dv.setUint16(32, 2, true);
  dv.setUint16(34, 16, true);
  str(36, 'data'); dv.setUint32(40, n * 2, true);

  for (let i = 0; i < n; i++) {
    // fade in/out so it doesn't click
    const env = Math.min(1, i / 1000, (n - i) / 1000);
    dv.setInt16(44 + i * 2, Math.sin(2 * Math.PI * freq * i / sampleRate) * 0.25 * env * 32767, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

function set(rowId, valId, detId, state, value, detail) {
  document.getElementById(rowId).className = 'row ' + state;
  document.getElementById(valId).textContent = value;
  document.getElementById(detId).textContent = detail || '';
}

const results = {};

function verdict() {
  if (results.audio === undefined || results.ctx === undefined) return;
  const el = document.getElementById('verdict');
  if (results.audio && results.ctx) {
    el.textContent = 'PASS — browser-played audio + lip sync will work.';
    el.style.color = '#3ac36a';
  } else if (results.audio && !results.ctx) {
    el.textContent = 'PARTIAL — audio plays, but lip sync needs the server-side envelope fallback.';
    el.style.color = '#d8a33c';
  } else {
    el.textContent = 'FAIL — keep audio on the server (pygame); animate from a precomputed envelope.';
    el.style.color = '#e0523f';
  }
}

// ---- Test 1: <audio> element ----
const blob = makeWavBlob(440, 0.6, 44100);
const audio = new Audio(URL.createObjectURL(blob));
audio.play().then(() => {
  results.audio = true;
  set('row-audio', 'v-audio', 'd-audio', 'pass', 'ALLOWED', 'play() resolved. You should have heard a 440Hz beep.');
  verdict();
}).catch(err => {
  results.audio = false;
  set('row-audio', 'v-audio', 'd-audio', 'fail', 'BLOCKED', err.name + ': ' + err.message);
  verdict();
});

// ---- Test 2: AudioContext ----
setTimeout(() => {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const report = () => {
      const running = ctx.state === 'running';
      results.ctx = running;
      set('row-ctx', 'v-ctx', 'd-ctx', running ? 'pass' : 'fail',
          running ? 'RUNNING' : 'SUSPENDED',
          'AudioContext.state = "' + ctx.state + '"' +
          (running ? '. A 660Hz beep should follow.' : '. Needs a user gesture to resume.'));
      if (running) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 660;
        gain.gain.value = 0.15;
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.6);
      }
      verdict();
    };
    // give the context a moment to settle before reading state
    setTimeout(report, 300);
  } catch (e) {
    results.ctx = false;
    set('row-ctx', 'v-ctx', 'd-ctx', 'fail', 'ERROR', String(e));
    verdict();
  }
}, 1000);

// ---- Environment ----
document.getElementById('d-env').textContent =
  'loaded ' + new Date().toLocaleTimeString() + '  |  ' + navigator.userAgent;
</script>

</body>
</html>
